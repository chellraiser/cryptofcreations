```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Commissions | Crypt of Creations</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{
background:#080808;
color:#f5f5f0;
font-family:'Inter',sans-serif;
}


/* HEADER */

header{
padding:50px 8%;
border-bottom:1px solid rgba(255,255,255,.1);
}


.back{
color:#888;
text-decoration:none;
font-size:.75rem;
letter-spacing:2px;
text-transform:uppercase;
transition:.3s;
}


.back:hover{
color:white;
}


/* HERO */

.hero{
padding:100px 8% 70px;
}


.hero h1{
font-family:'Cormorant Garamond',serif;
font-size:clamp(4rem,8vw,7rem);
font-weight:500;
letter-spacing:-2px;
}


.hero p{
max-width:700px;
margin-top:25px;
color:#aaa;
line-height:1.8;
}


/* FORM */

.form-wrapper{
width:84%;
max-width:1000px;
margin:auto;
padding-bottom:120px;
}


form{
display:flex;
flex-direction:column;
gap:35px;
}


.form-group{
display:flex;
flex-direction:column;
gap:10px;
}


label{
font-size:.7rem;
letter-spacing:2px;
text-transform:uppercase;
color:#aaa;
}


input,
select,
textarea{
width:100%;
background:#111;
border:1px solid rgba(255,255,255,.15);
color:#f5f5f0;
padding:16px;
font-family:'Inter',sans-serif;
font-size:.9rem;
outline:none;
transition:.3s;
}


input:focus,
select:focus,
textarea:focus{
border-color:rgba(255,255,255,.5);
}


textarea{
min-height:180px;
resize:vertical;
}


select{
appearance:auto;
}


::placeholder{
color:#666;
}


/* TWO COLUMN ROW */

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}


/* AGREEMENT */

.form-group label:has(input[type="checkbox"]){
display:flex;
flex-direction:row;
align-items:flex-start;
gap:10px;
text-transform:none;
letter-spacing:0;
font-size:.75rem;
line-height:1.6;
color:#888;
}


.form-group label input[type="checkbox"]{
width:auto;
margin:3px 0 0 0;
}


/* SUBMIT BUTTON */

.submit-button{
background:#f5f5f0;
color:#080808;
border:none;
padding:18px 30px;
font-family:'Inter',sans-serif;
font-size:.7rem;
letter-spacing:2px;
text-transform:uppercase;
cursor:pointer;
transition:.3s;
align-self:flex-start;
}


.submit-button:hover{
background:#aaa;
}


/* FOOTER */

footer{
border-top:1px solid rgba(255,255,255,.1);
padding:50px 8%;
font-size:.75rem;
letter-spacing:2px;
color:#777;
}


/* MOBILE */

@media(max-width:800px){

.form-row{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<header>

<a class="back" href="contact.html">
← Return to Contact
</a>

</header>


<section class="hero">

<h1>Commissions</h1>

<p>
Have a project in mind? Tell me a little about what you're
looking to create. The more detail you provide, the better I
can understand your vision and determine how I can help bring
it to life.
</p>

</section>


<section class="form-wrapper">

<form>


<div class="form-row">

<div class="form-group">

<label for="name">Name</label>

<input
type="text"
id="name"
name="name"
placeholder="Your name"
required
>

</div>


<div class="form-group">

<label for="email">Email</label>

<input
type="email"
id="email"
name="email"
placeholder="Your email address"
required
>

</div>

</div>


<div class="form-group">

<label for="project">
What are you looking to commission?
</label>

<select id="project" name="project" required>

<option value="" disabled selected>
Select a project type
</option>

<option value="graphic-design">
Graphic Design
</option>

<option value="branding">
Branding / Identity
</option>

<option value="illustration">
Illustration
</option>

<option value="album-art">
Album / Cover Art
</option>

<option value="apparel">
Apparel / Merch Design
</option>

<option value="social-media">
Social Media Design
</option>

<option value="print">
Print / Stationery
</option>

<option value="web">
Web Design
</option>

<option value="other">
Other
</option>

</select>

</div>


<div class="form-group">

<label for="description">
Tell me about your project
</label>

<textarea
id="description"
name="description"
placeholder="What are you creating? What do you need designed? Tell me about your vision, ideas, and anything else I should know."
required
></textarea>

</div>


<div class="form-group">

<label for="style">
Describe your desired style or aesthetic
</label>

<textarea
id="style"
name="style"
placeholder="Colors, mood, references, artists, existing branding, visual direction, etc."
></textarea>

</div>


<div class="form-row">

<div class="form-group">

<label for="budget">
Budget Range
</label>

<select id="budget" name="budget">

<option value="" disabled selected>
Select a range
</option>

<option value="under-250">
Under $250
</option>

<option value="250-500">
$250 — $500
</option>

<option value="500-1000">
$500 — $1,000
</option>

<option value="1000-2500">
$1,000 — $2,500
</option>

<option value="2500-plus">
$2,500+
</option>

<option value="unsure">
Not sure yet
</option>

</select>

</div>


<div class="form-group">

<label for="deadline">
Desired Deadline
</label>

<input
type="text"
id="deadline"
name="deadline"
placeholder="Example: October 15, 2026"
>

</div>

</div>


<div class="form-group">

<label for="references">
Reference / Inspiration Link
</label>

<input
type="url"
id="references"
name="references"
placeholder="https://..."
>

</div>


<div class="form-group">

<label for="notes">
Additional Notes
</label>

<textarea
id="notes"
name="notes"
placeholder="Anything else you'd like me to know?"
></textarea>

</div>


<div class="form-group">

<label>

<input
type="checkbox"
name="agreement"
required
>

I understand that submitting this form is a commission inquiry
and does not guarantee acceptance or begin work.

</label>

</div>


<button type="submit" class="submit-button">
Submit Commission Request
</button>


</form>

</section>


<footer>

CRYPT OF CREATIONS © 2026

</footer>


</body>

</html>
```
